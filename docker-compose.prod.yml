services:
  app:
    image: ${GHCR_IMAGE}
    restart: unless-stopped
    # Loopback only: nginx on the host proxies ledgerly.lk to 127.0.0.1:3001
    # (behind Cloudflare). Publishing on 0.0.0.0 exposed the container directly,
    # bypassing Cloudflare and nginx (Docker iptables rules bypass ufw).
    ports:
      - "127.0.0.1:3001:3000"
