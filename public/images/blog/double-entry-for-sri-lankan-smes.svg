<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <mask id="fade1">
      <linearGradient id="fadeGrad1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#000"/>
        <stop offset="0.18" stop-color="#fff"/>
        <stop offset="0.82" stop-color="#fff"/>
        <stop offset="1" stop-color="#000"/>
      </linearGradient>
      <rect x="0" y="0" width="1200" height="630" fill="url(#fadeGrad1)"/>
    </mask>
  </defs>
  <rect width="1200" height="630" fill="#100f0c"/>
  <g mask="url(#fade1)" stroke="#2b2620" stroke-width="1">
    <line x1="0" y1="44" x2="1200" y2="44"/><line x1="0" y1="88" x2="1200" y2="88"/>
    <line x1="0" y1="132" x2="1200" y2="132"/><line x1="0" y1="176" x2="1200" y2="176"/>
    <line x1="0" y1="220" x2="1200" y2="220"/><line x1="0" y1="264" x2="1200" y2="264"/>
    <line x1="0" y1="308" x2="1200" y2="308"/><line x1="0" y1="352" x2="1200" y2="352"/>
    <line x1="0" y1="396" x2="1200" y2="396"/><line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="484" x2="1200" y2="484"/><line x1="0" y1="528" x2="1200" y2="528"/>
    <line x1="0" y1="572" x2="1200" y2="572"/>
  </g>
  <!-- T-account -->
  <g transform="translate(600,315)">
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#3a352b" stroke-width="2"/>
    <line x1="-260" y1="-140" x2="260" y2="-140" stroke="#9b95f7" stroke-width="3"/>
    <!-- debit marks (left) -->
    <g stroke="#9b95f7" stroke-width="10" stroke-linecap="round" opacity="0.9">
      <line x1="-220" y1="-90" x2="-60" y2="-90"/>
      <line x1="-220" y1="-40" x2="-110" y2="-40"/>
      <line x1="-220" y1="10" x2="-150" y2="10"/>
    </g>
    <!-- credit marks (right) -->
    <g stroke="#2dd4bf" stroke-width="10" stroke-linecap="round" opacity="0.9">
      <line x1="60" y1="-90" x2="220" y2="-90"/>
      <line x1="110" y1="-40" x2="220" y2="-40"/>
      <line x1="150" y1="10" x2="220" y2="10"/>
    </g>
    <line x1="-260" y1="60" x2="260" y2="60" stroke="#3a352b" stroke-width="2"/>
    <g stroke="#f2f3fa" stroke-width="10" stroke-linecap="round">
      <line x1="-220" y1="100" x2="-40" y2="100"/>
      <line x1="40" y1="100" x2="220" y2="100"/>
    </g>
    <circle cx="0" cy="100" r="7" fill="#9b95f7"/>
  </g>
</svg>
